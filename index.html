<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Fylo data storage component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- box 1 -->
  <div class="container">
    <div class="box1">
      <img src="images/logo.svg" class="logo">
      <div class="icon-wrapper">
        <div class="icon">
          <img src="images/icon-document.svg">
        </div>
        <div class="icon">
          <img src="images/icon-folder.svg">
        </div>
        <div class="icon">
          <img src="images/icon-upload.svg">
        </div>
      </div>
    </div>

    <!-- box 2 -->
    <div class="box2">
      <p class="text">
        You’ve used <strong>815 GB</strong> of your storage
      </p>
      <div class="slider-wrapper">
        <div class="slider">
          <div class="slider-gradient">
            <div class="slider-dot">

            </div>

          </div>

        </div>




      </div>

      <div class="gb-wrapper">
        <p><strong>
            0 GB
          </strong>
        </p>
        <p>
          <strong>
            1000 GB
          </strong>

        </p>
      </div>
    </div>

    <div class="flag">
      <span class="gb">185</span>
      <strong><span class="gb-left"> GB LEFT</span></strong>
    </div>
  </div>
</body>
</html>
